name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dev dependencies (clean checkout)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check apps router.py
      - name: Whitespace check
        run: git diff --check HEAD

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Type/schema checks — config, templates, compose, migrations parse
        run: |
          python -c "import yaml; yaml.safe_load(open('config.yaml', encoding='utf-8')); yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
          python -c "from apps.gateway.config.templates import ProviderTemplateRegistry; ProviderTemplateRegistry()"
          python -m compileall -q apps router.py migrations

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Integration tests
        run: python -m pytest tests/integration -q

  migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: "***"
          POSTGRES_DB: smart_router_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:***@localhost:5432/smart_router_test"
        run: alembic upgrade head
      - name: Alembic round-trip (downgrade base + upgrade head)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:***@localhost:5432/smart_router_test"
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL persistence integration tests
        env:
          SMART_ROUTER_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:***@localhost:5432/smart_router_test"
        run: python -m pytest tests/integration/test_persistent_provider_registry.py tests/unit/test_migration_smoke.py -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t smart-router/gateway:ci .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t smart-router/worker:ci .

  acceptance-smoke:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Acceptance smoke tests
        env:
          SMART_ROUTER_ENV: development
        run: python -m pytest tests/integration/test_acceptance_smoke.py -q
